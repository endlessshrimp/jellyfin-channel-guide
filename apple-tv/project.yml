# XcodeGen spec for the HOMER Apple TV app. `xcodegen generate` in this
# folder writes HOMER.xcodeproj (not committed). See README.md.
name: HOMER
options:
  bundleIdPrefix: org.nelsons
  deploymentTarget:
    tvOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  HOMER:
    type: application
    platform: tvOS
    sources:
      - path: HOMER
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_NAME: HOMER
        # Free Apple IDs can't share a bundle id with anyone else's app. If
        # Xcode says this one is taken, change the last part.
        PRODUCT_BUNDLE_IDENTIFIER: org.nelsons.homer.appletv
        INFOPLIST_FILE: HOMER/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "3"
        CODE_SIGN_STYLE: Automatic
        # Pick your team in Xcode (Signing & Capabilities); re-running
        # xcodegen clears it again.
        DEVELOPMENT_TEAM: ""
    scheme:
      commandLineArguments:
        # Tick this in Edit Scheme… → Run → Arguments to open another page.
        "-HomerURL http://192.168.68.100:8096/web/index.html#/home": false
